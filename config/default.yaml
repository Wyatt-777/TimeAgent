agent:
  name: LocalPCAgent
  log_level: INFO

process_monitor:
  enabled: true
  interval_seconds: 2
  important_processes:
    - Code.exe
    - python.exe
    - codex.exe
    - claude.exe

coding_agent_monitor:
  enabled: true
  interval_seconds: 2
  process_names:
    - codex.exe
    - claude.exe

file_monitor:
  enabled: true
  recursive: true
  paths:
    - D:/trackTime/local-pc-agent
  ignore:
    - .git
    - node_modules
    - .venv
    - __pycache__
    - target
    - build
    - data

window_monitor:
  enabled: true
  interval_seconds: 1

system_monitor:
  enabled: true
  interval_seconds: 10

storage:
  sqlite_path: data/agent.db
  log_path: data/logs

privacy:
  screen_capture_enabled: false
  retain_screenshots_days: 1

agent_brain:
  enabled: false

codex:
  enabled: true
  investigation:
    enabled: true
    mode: read_only
    timeout_seconds: 120
    max_invocations: 3
    window_seconds: 3600
    auto_investigate: false

notifications:
  enabled: true
  minimum_priority: IMPORTANT
  cooldown_seconds: 300
  dedup_window_seconds: 600

proactive_agent:
  enabled: true
  notify_on:
    - CODING_SESSION_FINISHED
    - TEST_FAILED_REPEATEDLY
    - SYSTEM_DISK_LOW
